<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 920" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5B7FA5"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4A8C5C"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C0392B"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3498DB;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="authGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8E44AD;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#9B59B6;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="510" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#2C3E50">HttpMcpServer Architecture</text>
  <text x="510" y="55" text-anchor="middle" font-size="12" fill="#7F8C8D">ASP.NET Core MCP Server with Auth0 JWT &amp; SQLite Document Store</text>

  <!-- ============ Client Layer ============ -->
  <rect x="30" y="75" width="960" height="100" rx="8" fill="#EBF5FB" stroke="#AED6F1" stroke-width="1" filter="url(#shadow)"/>
  <text x="50" y="97" font-size="13" font-weight="bold" fill="#2980B9">MCP Clients</text>

  <!-- Claude Desktop -->
  <rect x="55" y="107" width="150" height="50" rx="6" fill="white" stroke="#3498DB" stroke-width="1.5"/>
  <text x="130" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#2C3E50">Claude Desktop</text>
  <text x="130" y="143" text-anchor="middle" font-size="9" fill="#7F8C8D">mcp-remote proxy</text>

  <!-- MCP Inspector -->
  <rect x="230" y="107" width="150" height="50" rx="6" fill="white" stroke="#3498DB" stroke-width="1.5"/>
  <text x="305" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#2C3E50">MCP Inspector</text>
  <text x="305" y="143" text-anchor="middle" font-size="9" fill="#7F8C8D">Streamable HTTP</text>

  <!-- Claude Code CLI -->
  <rect x="405" y="107" width="150" height="50" rx="6" fill="white" stroke="#3498DB" stroke-width="1.5"/>
  <text x="480" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#2C3E50">Claude Code CLI</text>
  <text x="480" y="143" text-anchor="middle" font-size="9" fill="#7F8C8D">streamable-http</text>

  <!-- Custom Client -->
  <rect x="580" y="107" width="150" height="50" rx="6" fill="white" stroke="#3498DB" stroke-width="1.5"/>
  <text x="655" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#2C3E50">Custom Client</text>
  <text x="655" y="143" text-anchor="middle" font-size="9" fill="#7F8C8D">JSON-RPC 2.0</text>

  <!-- ============ Transport Layer ============ -->
  <line x1="510" y1="175" x2="510" y2="205" stroke="#5B7FA5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="530" y="195" font-size="10" fill="#5B7FA5">POST /mcp (JSON-RPC 2.0)</text>

  <!-- ============ ASP.NET Core Host ============ -->
  <rect x="30" y="205" width="960" height="320" rx="8" fill="#FDFEFE" stroke="#BDC3C7" stroke-width="1" filter="url(#shadow)"/>
  <rect x="30" y="205" width="960" height="28" rx="8" fill="url(#headerGrad)"/>
  <text x="510" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="white">ASP.NET Core Host (Program.cs) — .NET 10</text>

  <!-- Middleware Pipeline -->
  <rect x="55" y="248" width="910" height="55" rx="5" fill="#F8F9FA" stroke="#D5D8DC" stroke-width="1"/>
  <text x="75" y="268" font-size="11" font-weight="bold" fill="#2C3E50">Middleware Pipeline:</text>
  <rect x="75" y="275" width="85" height="20" rx="3" fill="#EBF5FB" stroke="#3498DB" stroke-width="1"/>
  <text x="117" y="289" text-anchor="middle" font-size="9" fill="#2C3E50">CORS</text>
  <text x="170" y="289" font-size="11" fill="#95A5A6">→</text>
  <rect x="180" y="275" width="110" height="20" rx="3" fill="#F5EEF8" stroke="#8E44AD" stroke-width="1"/>
  <text x="235" y="289" text-anchor="middle" font-size="9" fill="#2C3E50">Authentication</text>
  <text x="300" y="289" font-size="11" fill="#95A5A6">→</text>
  <rect x="310" y="275" width="100" height="20" rx="3" fill="#F5EEF8" stroke="#8E44AD" stroke-width="1"/>
  <text x="360" y="289" text-anchor="middle" font-size="9" fill="#2C3E50">Authorization</text>
  <text x="420" y="289" font-size="11" fill="#95A5A6">→</text>
  <rect x="430" y="275" width="85" height="20" rx="3" fill="#FEF9E7" stroke="#F39C12" stroke-width="1"/>
  <text x="472" y="289" text-anchor="middle" font-size="9" fill="#2C3E50">Logging</text>
  <text x="525" y="289" font-size="11" fill="#95A5A6">→</text>
  <rect x="535" y="275" width="120" height="20" rx="3" fill="#EBF5FB" stroke="#3498DB" stroke-width="1"/>
  <text x="595" y="289" text-anchor="middle" font-size="9" fill="#2C3E50">MapMcp("/mcp")</text>
  <text x="665" y="289" font-size="11" fill="#95A5A6">→</text>
  <rect x="675" y="275" width="110" height="20" rx="3" fill="#EAFAF1" stroke="#27AE60" stroke-width="1"/>
  <text x="730" y="289" text-anchor="middle" font-size="9" fill="#2C3E50">HealthChecks</text>

  <!-- MCP SDK Box -->
  <rect x="55" y="315" width="540" height="195" rx="6" fill="white" stroke="#3498DB" stroke-width="1.5"/>
  <rect x="55" y="315" width="540" height="25" rx="6" fill="#3498DB"/>
  <text x="325" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="white">MCP SDK (ModelContextProtocol v1.4.0)</text>

  <!-- Transport -->
  <rect x="75" y="350" width="160" height="35" rx="4" fill="#EBF5FB" stroke="#2980B9" stroke-width="1"/>
  <text x="155" y="365" text-anchor="middle" font-size="10" font-weight="bold" fill="#2C3E50">StreamableHttp Transport</text>
  <text x="155" y="378" text-anchor="middle" font-size="8" fill="#7F8C8D">POST /mcp endpoint</text>

  <!-- Auth Filters -->
  <rect x="250" y="350" width="160" height="35" rx="4" fill="#F5EEF8" stroke="#8E44AD" stroke-width="1"/>
  <text x="330" y="365" text-anchor="middle" font-size="10" font-weight="bold" fill="#2C3E50">Authorization Filters</text>
  <text x="330" y="378" text-anchor="middle" font-size="8" fill="#7F8C8D">[Authorize] / [AllowAnonymous]</text>

  <!-- Tool Registry -->
  <rect x="425" y="350" width="150" height="35" rx="4" fill="#EAFAF1" stroke="#27AE60" stroke-width="1"/>
  <text x="500" y="365" text-anchor="middle" font-size="10" font-weight="bold" fill="#2C3E50">Tool Registry</text>
  <text x="500" y="378" text-anchor="middle" font-size="8" fill="#7F8C8D">WithTools&lt;T&gt;()</text>

  <!-- Public Tools -->
  <rect x="75" y="400" width="235" height="100" rx="4" fill="#EAFAF1" stroke="#27AE60" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="192" y="418" text-anchor="middle" font-size="11" font-weight="bold" fill="#27AE60">Public Tools [AllowAnonymous]</text>
  <rect x="85" y="425" width="105" height="22" rx="3" fill="white" stroke="#27AE60" stroke-width="1"/>
  <text x="137" y="440" text-anchor="middle" font-size="9" fill="#2C3E50">WeatherTools</text>
  <rect x="200" y="425" width="100" height="22" rx="3" fill="white" stroke="#27AE60" stroke-width="1"/>
  <text x="250" y="440" text-anchor="middle" font-size="9" fill="#2C3E50">CalculatorTools</text>
  <rect x="85" y="455" width="105" height="22" rx="3" fill="white" stroke="#27AE60" stroke-width="1"/>
  <text x="137" y="470" text-anchor="middle" font-size="9" fill="#2C3E50">TimeTools</text>
  <text x="85" y="493" font-size="8" fill="#7F8C8D">5 tools: weather, forecast, calc, units, time</text>

  <!-- Protected Tools -->
  <rect x="325" y="400" width="250" height="100" rx="4" fill="#FDEDEC" stroke="#E74C3C" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="450" y="418" text-anchor="middle" font-size="11" font-weight="bold" fill="#E74C3C">Protected Tools [Authorize]</text>
  <rect x="335" y="425" width="225" height="22" rx="3" fill="white" stroke="#E74C3C" stroke-width="1"/>
  <text x="447" y="440" text-anchor="middle" font-size="9" fill="#2C3E50">DatabaseTools (DI-injected)</text>
  <text x="335" y="465" font-size="8" fill="#7F8C8D">7 tools: search, get, list, create,</text>
  <text x="335" y="477" font-size="8" fill="#7F8C8D">update, delete, count documents</text>
  <text x="335" y="493" font-size="8" fill="#C0392B">Requires valid Auth0 JWT</text>

  <!-- Auth0 JWT Box -->
  <rect x="620" y="315" width="350" height="100" rx="6" fill="white" stroke="#8E44AD" stroke-width="1.5"/>
  <rect x="620" y="315" width="350" height="25" rx="6" fill="url(#authGrad)"/>
  <text x="795" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Auth0 JWT Authentication</text>

  <rect x="640" y="350" width="145" height="50" rx="4" fill="#F5EEF8" stroke="#8E44AD" stroke-width="1"/>
  <text x="712" y="368" text-anchor="middle" font-size="9" font-weight="bold" fill="#2C3E50">JWKS Key Loading</text>
  <text x="712" y="382" text-anchor="middle" font-size="8" fill="#7F8C8D">/{domain}/.well-known/</text>
  <text x="712" y="393" text-anchor="middle" font-size="8" fill="#7F8C8D">jwks.json (startup)</text>

  <rect x="800" y="350" width="150" height="50" rx="4" fill="#F5EEF8" stroke="#8E44AD" stroke-width="1"/>
  <text x="875" y="368" text-anchor="middle" font-size="9" font-weight="bold" fill="#2C3E50">OAuth Discovery</text>
  <text x="875" y="382" text-anchor="middle" font-size="8" fill="#7F8C8D">/.well-known/</text>
  <text x="875" y="393" text-anchor="middle" font-size="8" fill="#7F8C8D">oauth-protected-resource</text>

  <!-- ============ Data Layer ============ -->
  <rect x="620" y="425" width="350" height="85" rx="6" fill="white" stroke="#E67E22" stroke-width="1.5"/>
  <rect x="620" y="425" width="350" height="25" rx="6" fill="#E67E22"/>
  <text x="795" y="443" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Data Layer (SQLite + Dapper)</text>

  <rect x="640" y="460" width="145" height="38" rx="4" fill="#FEF9E7" stroke="#F39C12" stroke-width="1"/>
  <text x="712" y="476" text-anchor="middle" font-size="9" font-weight="bold" fill="#2C3E50">DatabaseInitializer</text>
  <text x="712" y="490" text-anchor="middle" font-size="8" fill="#7F8C8D">Schema + seed data</text>

  <rect x="800" y="460" width="145" height="38" rx="4" fill="#FEF9E7" stroke="#F39C12" stroke-width="1"/>
  <text x="872" y="476" text-anchor="middle" font-size="9" font-weight="bold" fill="#2C3E50">mcp.db (SQLite)</text>
  <text x="872" y="490" text-anchor="middle" font-size="8" fill="#7F8C8D">documents table</text>

  <!-- Connection arrow from DBTools to Data Layer -->
  <line x1="575" y1="450" x2="618" y2="450" stroke="#E67E22" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- ============ External Services ============ -->
  <line x1="795" y1="525" x2="795" y2="555" stroke="#8E44AD" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <line x1="510" y1="525" x2="510" y2="555" stroke="#4A8C5C" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>

  <!-- Auth0 Cloud -->
  <rect x="660" y="560" width="280" height="70" rx="8" fill="#F5EEF8" stroke="#8E44AD" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="800" y="585" text-anchor="middle" font-size="12" font-weight="bold" fill="#8E44AD">Auth0 (Cloud)</text>
  <text x="800" y="602" text-anchor="middle" font-size="10" fill="#7F8C8D">OAuth 2.0 / OIDC Provider</text>
  <text x="800" y="618" text-anchor="middle" font-size="9" fill="#95A5A6">RS256 JWT signing, Authorization Code + PKCE</text>

  <!-- SQLite File -->
  <rect x="390" y="560" width="240" height="70" rx="8" fill="#FEF9E7" stroke="#F39C12" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="510" y="585" text-anchor="middle" font-size="12" font-weight="bold" fill="#E67E22">SQLite Database</text>
  <text x="510" y="602" text-anchor="middle" font-size="10" fill="#7F8C8D">File: data/mcp.db</text>
  <text x="510" y="618" text-anchor="middle" font-size="9" fill="#95A5A6">documents table (6 columns, 10 seed rows)</text>

  <!-- ============ Legend ============ -->
  <rect x="30" y="650" width="960" height="90" rx="8" fill="#F8F9FA" stroke="#D5D8DC" stroke-width="1"/>
  <text x="510" y="672" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C3E50">Authorization Flow</text>

  <!-- No token flow -->
  <rect x="70" y="685" width="400" height="42" rx="4" fill="white" stroke="#27AE60" stroke-width="1"/>
  <text x="90" y="703" font-size="10" font-weight="bold" fill="#27AE60">No Token:</text>
  <text x="160" y="703" font-size="10" fill="#2C3E50">tools/list → 5 public tools visible (search_documents hidden)</text>
  <text x="90" y="720" font-size="10" fill="#2C3E50">tools/call → public tools work, protected tools → 401 Unauthorized</text>

  <!-- With JWT flow -->
  <rect x="490" y="685" width="480" height="42" rx="4" fill="white" stroke="#8E44AD" stroke-width="1"/>
  <text x="510" y="703" font-size="10" font-weight="bold" fill="#8E44AD">Valid JWT:</text>
  <text x="580" y="703" font-size="10" fill="#2C3E50">tools/list → all 12 tools visible</text>
  <text x="510" y="720" font-size="10" fill="#2C3E50">tools/call → all tools accessible (search, get, list, create, update, delete, count)</text>

  <!-- ============ Endpoints Table ============ -->
  <rect x="30" y="760" width="960" height="60" rx="8" fill="#FDFEFE" stroke="#BDC3C7" stroke-width="1"/>
  <text x="50" y="780" font-size="11" font-weight="bold" fill="#2C3E50">Endpoints:</text>
  <text x="50" y="800" font-size="10" fill="#2C3E50">/mcp</text>
  <text x="120" y="800" font-size="10" fill="#7F8C8D">— MCP StreamableHttp (JSON-RPC 2.0)</text>
  <text x="370" y="800" font-size="10" fill="#2C3E50">/health</text>
  <text x="450" y="800" font-size="10" fill="#7F8C8D">— Health check</text>
  <text x="600" y="800" font-size="10" fill="#2C3E50">/.well-known/oauth-protected-resource</text>
  <text x="860" y="800" font-size="10" fill="#7F8C8D">— OAuth discovery</text>

  <!-- Version badge -->
  <rect x="830" y="840" width="160" height="24" rx="12" fill="#2C3E50"/>
  <text x="910" y="856" text-anchor="middle" font-size="10" fill="white">Protocol: 2024-11-05</text>
</svg>